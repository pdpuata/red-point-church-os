name: Sermon System Preflight

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sermon-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sermon-preflight:
    name: Verify live sermon pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test Red Point RSS → Supabase → audio → app
        env:
          SUPABASE_E2E_URL: https://gvyqluwtzujefernhvfd.supabase.co
        run: npm run sermon:preflight
