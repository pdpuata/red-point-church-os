name: Exact iOS runtime acceptance 808a7e9e
on:
  push:
    paths: [".github/workflows/ios-runtime-808a7e9e.yml"]
jobs:
  runtime:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Materialize exact GitLab binary assets
        run: |
          for f in assets/icon.png assets/adaptive-icon.png assets/app-icon.png assets/splash-icon.png; do
            base64 -D -i "$f" -o "$f.bin"
            mv "$f.bin" "$f"
          done
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci --no-audit --no-fund
      - run: npx expo prebuild --platform ios --clean --no-install
      - run: npx pod-install
      - name: Build Release simulator
        run: |
          xcodebuild -workspace ios/RedPointChurch.xcworkspace -scheme RedPointChurch -configuration Release -sdk iphonesimulator -derivedDataPath /tmp/rp-derived CODE_SIGNING_ALLOWED=NO build
      - name: Boot install launch deep-link crash smoke
        run: |
          set -euo pipefail
          DEVICE="$(xcrun simctl list devices available | grep -m1 -E 'iPhone (16|17|Air|Pro)' | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')"
          test -n "$DEVICE"
          xcrun simctl boot "$DEVICE" || true
          open -a Simulator || true
          xcrun simctl bootstatus "$DEVICE" -b
          APP="$(find /tmp/rp-derived/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)"
          test -d "$APP"
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl spawn "$DEVICE" log erase || true
          xcrun simctl launch "$DEVICE" com.redpointchurch.app
          sleep 10
          xcrun simctl io "$DEVICE" screenshot /tmp/red-point-ios-home.png
          xcrun simctl openurl "$DEVICE" "redpointchurch://sermons"
          sleep 5
          xcrun simctl io "$DEVICE" screenshot /tmp/red-point-ios-deeplink.png
          xcrun simctl spawn "$DEVICE" launchctl print system | grep -q com.redpointchurch.app || true
          xcrun simctl spawn "$DEVICE" log show --last 2m --style compact --predicate 'process == "RedPointChurch"' > /tmp/red-point-ios.log || true
          if grep -Ei "Terminating app due to uncaught exception|fatal error|SIGABRT" /tmp/red-point-ios.log; then cat /tmp/red-point-ios.log; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: red-point-808a7e9e-ios-runtime-evidence
          path: |
            /tmp/red-point-ios-home.png
            /tmp/red-point-ios-deeplink.png
            /tmp/red-point-ios.log
          if-no-files-found: warn
