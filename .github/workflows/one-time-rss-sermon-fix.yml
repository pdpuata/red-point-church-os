name: One-time RSS sermon UI fix

on:
  push:

jobs:
  patch:
    if: ${{ github.event.head_commit.message != 'Fix sermon source to Red Point RSS' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Patch sermon source UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('App.tsx')
          s = p.read_text()

          s = s.replace("const [syncingYouTube,setSyncingYouTube]=useState(false);", "const [syncingSermons,setSyncingSermons]=useState(false);")

          pattern = r"  const syncYouTube=async\(\)=>\{[\s\S]*?\n  \};"
          replacement = '''  const syncSermonsFromWebsite=async()=>{\n    setSyncingSermons(true);\n    try{\n      const library=await fetchSermonLibraryFromRss();\n      if(!library.length)throw new Error('No sermons were returned by the Red Point Church sermon feed.');\n      setSermons(library);\n      Alert.alert('Sermons refreshed',`Loaded ${library.length} sermons from the Red Point Church website.`);\n    }catch(error){Alert.alert('Could not refresh sermons',error instanceof Error?error.message:'Please try again.');}\n    finally{setSyncingSermons(false);}\n  };'''
          s2, n = re.subn(pattern, replacement, s, count=1)
          if n != 1:
              raise SystemExit('Could not locate syncYouTube function')
          s = s2

          old = "<Text style={styles.adminHint}>First sync YouTube. Imported videos stay as drafts until you review and publish them. Dates use South African time.</Text><Button label={syncingYouTube?'SYNCING YOUTUBE…':'SYNC YOUTUBE NOW'} onPress={syncYouTube}/>"
          new = "<Text style={styles.adminHint}>Sermons come from the Red Point Church website sermon feed. Refresh here to load the latest messages and the older sermon archive.</Text><Button label={syncingSermons?'REFRESHING SERMONS…':'REFRESH FROM RED POINT WEBSITE'} onPress={syncSermonsFromWebsite}/>"
          if old not in s:
              raise SystemExit('Could not locate sermon sync UI block')
          s = s.replace(old, new, 1)

          s = s.replace('YouTube sermon imports remain drafts until staff review and publish them.', 'The public sermon library is sourced from the Red Point Church website sermon feed.')
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add App.tsx README.md
          git diff --cached --quiet && exit 0
          git commit -m 'Fix sermon source to Red Point RSS'
          git push
