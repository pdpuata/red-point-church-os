name: One-time sermon RSS audio UI fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch sermon RSS audio handling
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('App.tsx')
          s=p.read_text()
          original=s

          s=s.replace("youtube_url: link, published: true, source_url: link", "youtube_url: link && /(?:youtube\\.com|youtu\\.be)/i.test(link) ? link : null, published: true, source_url: link")
          s=s.replace("{latestSermon ? 'TAP TO WATCH MESSAGE' : 'VIEW SERMONS'}", "{latestSermon ? (latestSermon.audio_url ? 'TAP TO LISTEN' : latestSermon.youtube_url ? 'TAP TO WATCH MESSAGE' : 'OPEN SERMON') : 'VIEW SERMONS'}")
          s=s.replace("WATCH LATEST MESSAGE ›", "{latest.audio_url ? 'LISTEN TO LATEST MESSAGE ›' : latest.youtube_url ? 'WATCH LATEST MESSAGE ›' : 'OPEN LATEST MESSAGE ›'}")
          s=s.replace("const [syncingYouTube,setSyncingYouTube]=useState(false);", "const [syncingSermonRss,setSyncingSermonRss]=useState(false);")
          s=s.replace("syncingYouTube", "syncingSermonRss")
          s=s.replace("syncYouTube", "syncSermonRss")

          old=r"\{sermon\.youtube_url\?<Button label=\"WATCH MESSAGE\" onPress=\{\(\)=>Linking\.openURL\(sermon\.youtube_url!\)\}/>:null\}<Button label=\"SHARE SERMON\" secondary onPress=\{share\}/\}"
          new='{sermon.audio_url?<Button label="LISTEN TO SERMON" onPress={()=>Linking.openURL(sermon.audio_url!)}/>:null}{sermon.youtube_url?<Button label="WATCH MESSAGE" onPress={()=>Linking.openURL(sermon.youtube_url!)}/>:null}{sermon.source_url?<Button label="OPEN SERMON PAGE" secondary onPress={()=>Linking.openURL(sermon.source_url!)}/>:null}<Button label="SHARE SERMON" secondary onPress={share}/>}'
          s,n=re.subn(old,new,s)

          pattern=r"const syncSermonRss=async\(\)=>\{.*?\};\n  const updateVisitorStatus"
          replacement="""const syncSermonRss=async()=>{setSyncingSermonRss(true);try{const library=await fetchSermonLibraryFromRss();if(!library.length)throw new Error('The Red Point sermon feed returned no sermons.');Alert.alert('Sermon feed refreshed',`${library.length} sermons are available from the Red Point Church website feed.`);}catch(e:any){Alert.alert('Could not refresh sermons',e?.message||'Please try again.');}finally{setSyncingSermonRss(false);}};\n  const updateVisitorStatus"""
          s,n2=re.subn(pattern,replacement,s,flags=re.S)

          s=s.replace("First sync YouTube. Imported videos stay as drafts until you review and publish them. Dates use South African time.", "Sermons come from the Red Point Church website sermon feed. Refresh here to load the latest messages and the older sermon archive.")
          s=s.replace("syncingSermonRss?'SYNCING YOUTUBE…':'SYNC YOUTUBE NOW'", "syncingSermonRss?'REFRESHING SERMON FEED…':'REFRESH FROM RED POINT WEBSITE'")
          s=s.replace("Or add a sermon manually.", "You can still add a sermon manually when the church needs to create a special entry.")
          s=s.replace("description: 'Watch the latest Red Point Church messages on the Red Point sermon feed.', preached_at: null, youtube_url: church.youtube", "description: 'Find the latest Red Point Church messages on the church sermon feed.', preached_at: null, youtube_url: null, source_url: church.sermonRss, audio_url: null")

          if s==original: raise SystemExit('No changes made')
          if 'youtube_url: link && /(?:youtube\\.com|youtu\\.be)/i.test(link)' not in s: raise SystemExit('RSS parser replacement did not apply')
          if 'LISTEN TO SERMON' not in s: raise SystemExit('Listen button replacement did not apply')
          if 'REFRESH FROM RED POINT WEBSITE' not in s: raise SystemExit('Admin RSS button replacement did not apply')
          p.write_text(s)
          print(f'Patched App.tsx; detail/admin regex replacements: {n}/{n2}')
          PY
      - name: Verify markers
        run: |
          grep -n "youtube_url: link &&\|LISTEN TO SERMON\|REFRESH FROM RED POINT WEBSITE\|syncSermonRss" App.tsx
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx
          git commit -m "Fix sermon RSS audio playback and labels"
          git push origin main
