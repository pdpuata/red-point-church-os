name: Fix sermon source ordering

on:
  push:
    branches: [main]
    paths: ['App.tsx', '.github/workflows/fix-sermon-source-order.yml']

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch sermon source logic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('App.tsx')
          s = p.read_text()
          old = "const SERMON_RSS_CACHE_KEY = 'red-point.sermon-rss-library.v3';"
          new = "const SERMON_RSS_CACHE_KEY = 'red-point.sermon-rss-library.v4';"
          if old in s:
              s = s.replace(old, new)
          old_sort = "const items = extractRssItems(xml).sort((a, b) => +new Date(b.published_at || b.preached_at || 0) - +new Date(a.published_at || a.preached_at || 0));"
          new_sort = "const items = extractRssItems(xml).sort((a, b) => +new Date(b.preached_at || b.published_at || 0) - +new Date(a.preached_at || a.published_at || 0));"
          if old_sort not in s:
              raise SystemExit('Expected sermon sort expression not found')
          s = s.replace(old_sort, new_sort)
          old_youtube = "youtube_url: link && /(?:youtube\\.com|youtu\\.be)/i.test(link) ? link : null,"
          new_youtube = "youtube_url: null,"
          if old_youtube not in s:
              raise SystemExit('Expected YouTube extraction expression not found')
          s = s.replace(old_youtube, new_youtube)
          p.write_text(s)
          PY
          git diff --check
          git diff -- App.tsx
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add App.tsx
          git commit -m 'fix: select latest sermon by sermon date [sermon-source]' || exit 0
          git push origin main
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/fix-sermon-source-order.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove temporary sermon source workflow [sermon-source]'
          git push origin main
