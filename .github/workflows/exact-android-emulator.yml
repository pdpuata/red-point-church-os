name: Exact Android emulator acceptance
on:
  workflow_run:
    workflows: ["Exact candidate native 808a7e9e"]
    types: [completed]
jobs:
  emulator:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: red-point-808a7e9e-android
          path: native
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Locate APK
        run: find native -type f -maxdepth 8 -print
      - name: Boot Android 16 and smoke test exact APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            APK=$(find native -name '*.apk' | head -1)
            test -n "$APK"
            adb install -r "$APK"
            adb shell am force-stop com.redpointchurch.app
            adb shell monkey -p com.redpointchurch.app -c android.intent.category.LAUNCHER 1
            sleep 20
            adb shell pidof com.redpointchurch.app
            adb exec-out screencap -p > android-exact-home.png
            if adb logcat -d -t 800 | grep -E "FATAL EXCEPTION|AndroidRuntime.*FATAL"; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: red-point-808a7e9e-android-emulator-evidence
          path: android-exact-home.png
