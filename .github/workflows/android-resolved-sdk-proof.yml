name: Android resolved SDK proof
on:
  push:
    paths: [".github/workflows/android-resolved-sdk-proof.yml"]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize exact GitLab binary assets
        run: for f in assets/icon.png assets/adaptive-icon.png assets/app-icon.png assets/splash-icon.png; do base64 -d "$f" > "$f.bin" && mv "$f.bin" "$f"; done
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: 17}
      - run: npm ci --no-audit --no-fund
      - run: npx expo prebuild --platform android --clean --no-install
      - run: cd android && ./gradlew :app:properties --no-daemon > /tmp/props.txt
      - run: grep -E "compileSdkVersion|targetSdkVersion|minSdkVersion|compileSdk|targetSdk|minSdk|buildToolsVersion" /tmp/props.txt || true
      - run: cd android && ./gradlew :app:processReleaseMainManifest --no-daemon
      - run: grep -RInE "uses-sdk|targetSdkVersion|minSdkVersion" android/app/build/intermediates/merged_manifests android/app/build/intermediates/packaged_manifests 2>/dev/null | head -30 || true
