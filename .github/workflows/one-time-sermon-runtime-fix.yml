name: One-time sermon runtime fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Patch App.tsx
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('App.tsx')
          s=p.read_text()
          old="""  if (Platform.OS === 'web' && supabase) {\n    const { data, error } = await supabase.functions.invoke('sermon-rss', { body: {} });\n    if (error) throw error;\n    const xml = (data as any)?.xml;\n    if (typeof xml === 'string' && xml.length) return xml;\n    throw new Error('RSS proxy unavailable');\n  }"""
          new="""  if (Platform.OS === 'web') {\n    const proxyUrl = 'https://gvyqluwtzujefernhvfd.supabase.co/functions/v1/sermon-rss';\n    const response = await fetch(proxyUrl, { method: 'POST', headers: { Accept: 'application/json', 'Content-Type': 'application/json' }, body: '{}' });\n    if (!response.ok) throw new Error(`RSS proxy ${response.status}`);\n    const data = await response.json();\n    const xml = data?.xml;\n    if (typeof xml === 'string' && xml.length) return xml;\n    throw new Error('RSS proxy returned no feed');\n  }"""
          if old not in s: raise SystemExit('web RSS block not found')
          s=s.replace(old,new,1)
          old2="""  } catch {\n    try {\n      const cached = await AsyncStorage.getItem(SERMON_RSS_CACHE_KEY);"""
          new2="""  } catch (error) {\n    console.warn('Red Point sermon RSS refresh failed', error);\n    try {\n      const cached = await AsyncStorage.getItem(SERMON_RSS_CACHE_KEY);"""
          if old2 not in s: raise SystemExit('RSS catch block not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Verify
        run: |
          grep -n "gvyqluwtzujefernhvfd.supabase.co/functions/v1/sermon-rss\|sermon RSS refresh failed" App.tsx
          npm ci
          npm run typecheck
      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx
          git commit -m "Fix public sermon RSS loading"
          git push origin main
          git rm .github/workflows/one-time-sermon-runtime-fix.yml
          git commit -m "Remove one-time sermon runtime fix workflow"
          git push origin main
