name: Android SDK value proof
on:
  push:
    paths: [".github/workflows/android-sdk-value-proof.yml"]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize exact GitLab binary assets
        run: for f in assets/icon.png assets/adaptive-icon.png assets/app-icon.png assets/splash-icon.png; do base64 -d "$f" > "$f.bin" && mv "$f.bin" "$f"; done
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci --no-audit --no-fund
      - run: npx expo prebuild --platform android --clean --no-install
      - run: |
          echo "=== gradle.properties ==="; cat android/gradle.properties
          echo "=== root ext references ==="; grep -RInE "compileSdkVersion|targetSdkVersion|minSdkVersion|buildToolsVersion" android | head -100
