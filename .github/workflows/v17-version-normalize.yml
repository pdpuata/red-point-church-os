name: V17 version normalization
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize version metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('App.tsx'); s=p.read_text(); s=s.replace("const APP_VERSION = '14.0.0';", "const APP_VERSION = '17.0.0';"); p.write_text(s)
          p=Path('package-lock.json'); s=p.read_text(); s=s.replace('"version": "14.0.0"', '"version": "17.0.0"'); p.write_text(s)
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm -f .github/workflows/v17-version-normalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx package-lock.json .github/workflows/v17-version-normalize.yml
          git diff --cached --quiet || git commit -m "Complete v17 version normalization"
          git push
