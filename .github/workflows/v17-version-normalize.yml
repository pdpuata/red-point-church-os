name: V17 dependency normalization
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install current dependency graph
        run: npm ci
      - name: Normalize v17 version metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('App.tsx'); s=p.read_text(); s=s.replace("const APP_VERSION = '14.0.0';", "const APP_VERSION = '17.0.0';"); p.write_text(s)
          p=Path('package-lock.json'); s=p.read_text(); s=s.replace('"version": "14.0.0"', '"version": "17.0.0"'); p.write_text(s)
          PY
      - name: Align Expo SDK dependencies
        run: npx expo install --fix
      - name: Verify
        run: npx expo-doctor
      - name: Commit normalized dependencies and version
        run: |
          rm -f .github/workflows/v17-version-normalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx package.json package-lock.json .github/workflows/v17-version-normalize.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Complete v17 version and Expo dependency normalization"
          git push
