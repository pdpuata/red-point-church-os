name: V17 dependency normalization
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install current dependency graph
        run: npm ci
      - name: Align Expo SDK dependencies
        run: npx expo install --fix
      - name: Verify
        run: npx expo-doctor
      - name: Commit normalized dependencies
        run: |
          rm -f .github/workflows/v17-version-normalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/v17-version-normalize.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Align Expo SDK 57 dependencies"
          git push
