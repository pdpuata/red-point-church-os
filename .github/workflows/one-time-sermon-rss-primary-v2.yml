name: One-time sermon RSS primary v2

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch App.tsx
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('App.tsx')
          s = p.read_text()
          s = s.replace("source?: 'database' | 'rss' };", "source?: 'database' | 'rss'; audio_url?: string | null };")
          s = s.replace("const SERMON_RSS_CACHE_KEY = 'red-point.latest-sermon-rss.v1';", "const SERMON_RSS_CACHE_KEY = 'red-point.sermon-rss-library.v2';")
          pattern = r"async function fetchLatestSermonFromRss\(\): Promise<RssSermon \| null> \{.*?\n\}\n\n\n\nclass AppErrorBoundary"
          replacement = '''async function fetchSermonLibraryFromRss(): Promise<RssSermon[]> {
            try {
              const xml = await fetchSermonRssXml();
              const items = extractRssItems(xml).sort((a, b) => +new Date(b.published_at || b.preached_at || 0) - +new Date(a.published_at || a.preached_at || 0));
              if (items.length) await AsyncStorage.setItem(SERMON_RSS_CACHE_KEY, JSON.stringify(items));
              return items;
            } catch {
              try {
                const cached = await AsyncStorage.getItem(SERMON_RSS_CACHE_KEY);
                const parsed = cached ? JSON.parse(cached) : [];
                return Array.isArray(parsed) ? parsed as RssSermon[] : [];
              } catch { return []; }
            }
          }
          async function fetchLatestSermonFromRss(): Promise<RssSermon | null> {
            const library = await fetchSermonLibraryFromRss();
            return library[0] || null;
          }
          class AppErrorBoundary'''
          s, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1: raise SystemExit('RSS function block not found')
          pattern = r"const rssLatest=await fetchLatestSermonFromRss\(\);\s*if\(rssLatest\)\{setSermons\(current=>\{const db=current\.filter\(s=>s\.id!==rssLatest\.id\);return \[rssLatest,\.\.\.db\]\.sort\(\(a,b\)=>\+new Date\(b\.preached_at\|\|0\)-\+new Date\(a\.preached_at\|\|0\)\);\}\);\}"
          s, n = re.subn(pattern, "const rssLibrary=await fetchSermonLibraryFromRss();\n    if(rssLibrary.length){setSermons(rssLibrary);}", s, count=1)
          if n != 1: raise SystemExit('RSS overlay block not found')
          pattern = r"\{\(sermon\.youtube_url\|\|sermon\.source_url\)\?<Button label=\"WATCH MESSAGE\" onPress=\{\(\)=>Linking\.openURL\(\(sermon\.youtube_url\|\|sermon\.source_url\)!\)\}\s*/>:null\}"
          s, n = re.subn(pattern, "{sermon.audio_url?<Button label=\"LISTEN TO SERMON\" onPress={()=>Linking.openURL(sermon.audio_url!)} />:null}{(sermon.youtube_url||sermon.source_url)?<Button label=\"OPEN SERMON PAGE\" secondary onPress={()=>Linking.openURL((sermon.youtube_url||sermon.source_url)!)} />:null}", s, count=1)
          if n != 1: raise SystemExit('Sermon detail block not found')
          p.write_text(s)
          PY
      - name: Typecheck
        run: npm ci && npx tsc --noEmit
      - name: Commit patch and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add App.tsx .github/workflows/one-time-sermon-rss-primary-v2.yml
          git rm .github/workflows/one-time-sermon-rss-primary-v2.yml
          git commit -m "Make sermon RSS the public sermon source of truth"
          git push origin HEAD:main
