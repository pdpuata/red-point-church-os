name: Apply YouTube sermon source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply YouTube sermon switch
        run: node .github/youtube-sermon-switch.mjs
      - name: Verify
        run: |
          ! grep -q "from 'expo-audio'" App.tsx
          grep -q "Watch this sermon on YouTube" App.tsx
          grep -q "youtube.com/results?search_query" App.tsx
      - name: Commit app change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx
          git diff --cached --quiet || git commit -m "feat: source sermons from YouTube"
          git push origin main
      - name: Remove temporary tooling
        run: |
          git rm -f .github/youtube-sermon-switch.mjs .github/workflows/apply-youtube-sermons.yml
          git commit -m "chore: remove temporary YouTube sermon tooling"
          git push origin main
