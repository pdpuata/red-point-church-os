name: One-time bottom navigation fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[ui-nav-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Align bottom navigation labels
        shell: python
        run: |
          from pathlib import Path
          p = Path('App.tsx')
          s = p.read_text()
          old = "{(['Home','Events','MyChurch','More'] as Screen[]).map(item=>"
          new = "{(['Home','Events','Sermons','More'] as Screen[]).map(item=>"
          if old not in s:
              raise SystemExit('Expected bottom navigation list was not found')
          s = s.replace(old, new, 1)
          old_label = "{item==='MyChurch'?'MY CHURCH':item}"
          new_label = "{item}"
          if old_label not in s:
              raise SystemExit('Expected bottom navigation label formatter was not found')
          s = s.replace(old_label, new_label, 1)
          p.write_text(s)
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx
          git commit -m "Align bottom navigation with primary destinations [ui-nav-fixed]"
          git push
