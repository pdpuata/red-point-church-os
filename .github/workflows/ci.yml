name: Red Point Church App CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo-doctor
      - run: npm run release-check
      - run: npm run typecheck
      - run: npm run ai:loop
      # v17: TypeScript, release consistency, operational-loop integrity, and canonical source restoration are mandatory.
