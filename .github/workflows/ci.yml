name: Red Point Church App CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply RSS sermon audio fix once
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('App.tsx')
          s = p.read_text()
          old = "youtube_url: link, published: true, source_url: link, source: 'rss' as const, published_at: publishedDate && !Number.isNaN(publishedDate.getTime()) ? publishedDate.toISOString() : null, audio_url: audio"
          new = "youtube_url: null, published: true, source_url: link, source: 'rss' as const, published_at: publishedDate && !Number.isNaN(publishedDate.getTime()) ? publishedDate.toISOString() : null, audio_url: audio"
          if old in s:
              s = s.replace(old, new, 1)
          elif "youtube_url: null, published: true, source_url: link" not in s:
              raise SystemExit('RSS audio mapping not found')
          old = "{latestSermon ? 'TAP TO WATCH MESSAGE' : 'VIEW SERMONS'}"
          new = "{latestSermon ? (latestSermon.audio_url ? 'TAP TO LISTEN' : latestSermon.youtube_url ? 'TAP TO WATCH MESSAGE' : 'OPEN SERMON') : 'VIEW SERMONS'}"
          if old in s:
              s = s.replace(old, new, 1)
          pattern = re.compile(r"function SermonDetail\(\{ sermon, navigate \}: \{ sermon\?: Sermon; navigate:\(s:Screen\)=>void \}\) \{[\s\S]*?(?=\nfunction [A-Za-z_])")
          replacement = '''function SermonDetail({ sermon, navigate }: { sermon?: Sermon; navigate:(s:Screen)=>void }) {
  if(!sermon) return <ScrollView contentContainerStyle={styles.content}><Pressable accessibilityRole="button" accessibilityLabel="Go back to sermons" hitSlop={8} onPress={()=>navigate('Sermons')}><Text style={styles.back}>‹ Back to sermons</Text></Pressable><Text style={styles.heading}>Sermon</Text><Text style={styles.intro}>This sermon could not be found.</Text></ScrollView>;
  const share=async()=>{try{await Share.share({title:sermon.title,message:`${sermon.title}${sermon.preached_at?`\\n${formatDate(sermon.preached_at)}`:''}${sermon.source_url?`\\n${sermon.source_url}`:''}`});}catch{}};
  const listen=()=>{if(sermon.audio_url) Linking.openURL(sermon.audio_url);};
  const watch=()=>{if(sermon.youtube_url) Linking.openURL(sermon.youtube_url);};
  const openSource=()=>{if(sermon.source_url) Linking.openURL(sermon.source_url);};
  return <ScrollView contentContainerStyle={styles.content}><Pressable accessibilityRole="button" accessibilityLabel="Go back to sermons" hitSlop={8} onPress={()=>navigate('Sermons')}><Text style={styles.back}>‹ Back to sermons</Text></Pressable><Text style={styles.eyebrow}>SERMON</Text><Text style={styles.heading}>{sermon.title}</Text>{sermon.preached_at?<Text style={styles.intro}>{formatDate(sermon.preached_at)}</Text>:null}{sermon.description?<Text style={styles.cardBody}>{sermon.description}</Text>:null}{sermon.audio_url?<Button label="LISTEN TO SERMON" onPress={listen}/>:null}{sermon.youtube_url?<Button label="WATCH MESSAGE" secondary onPress={watch}/>:null}{sermon.source_url?<Button label="OPEN SERMON PAGE" secondary onPress={openSource}/>:null}<Button label="SHARE" secondary onPress={share}/></ScrollView>;
}
'''
          s2, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'SermonDetail replacement matched {n} functions')
          p.write_text(s2)
          PY
      - name: Restore permanent CI workflow
        run: git checkout HEAD^ -- .github/workflows/ci.yml
      - run: npx expo-doctor
      - run: npm run release-check
      - run: npm run typecheck
      - run: npm run ai:loop
      - run: npm run admin-surface-check
      - run: npm run admin-workflow-check
      - run: npm run verify:admin
      - name: Commit RSS sermon audio fix
        run: |
          if git diff --quiet -- App.tsx; then
            echo "RSS sermon audio fix already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx
          git commit -m "Fix RSS sermon audio playback"
          git push

  admin-e2e:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate controlled runtime boundary
        env:
          SUPABASE_E2E_URL: ${{ secrets.SUPABASE_E2E_URL }}
          SUPABASE_E2E_ANON_KEY: ${{ secrets.SUPABASE_E2E_ANON_KEY }}
          SUPABASE_E2E_ADMIN_EMAIL: ${{ secrets.SUPABASE_E2E_ADMIN_EMAIL }}
          SUPABASE_E2E_ADMIN_PASSWORD: ${{ secrets.SUPABASE_E2E_ADMIN_PASSWORD }}
          SUPABASE_E2E_ENV: staging
          SUPABASE_E2E_ALLOW_MUTATIONS: true
          SUPABASE_E2E_CONFIRM: ${{ secrets.SUPABASE_E2E_CONFIRM }}
        run: npm run admin-runtime-readiness
      - name: Run controlled Admin E2E
        env:
          SUPABASE_E2E_URL: ${{ secrets.SUPABASE_E2E_URL }}
          SUPABASE_E2E_ANON_KEY: ${{ secrets.SUPABASE_E2E_ANON_KEY }}
          SUPABASE_E2E_ADMIN_EMAIL: ${{ secrets.SUPABASE_E2E_ADMIN_EMAIL }}
          SUPABASE_E2E_ADMIN_PASSWORD: ${{ secrets.SUPABASE_E2E_ADMIN_PASSWORD }}
          SUPABASE_E2E_ENV: staging
          SUPABASE_E2E_ALLOW_MUTATIONS: true
          SUPABASE_E2E_CONFIRM: ${{ secrets.SUPABASE_E2E_CONFIRM }}
        run: npm run admin-workflow-e2e
