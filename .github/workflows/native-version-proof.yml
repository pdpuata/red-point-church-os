name: Native version proof
on:
  push:
    paths: [".github/workflows/native-version-proof.yml"]
jobs:
  inspect:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Materialize exact GitLab binary assets
        run: for f in assets/icon.png assets/adaptive-icon.png assets/app-icon.png assets/splash-icon.png; do base64 -D -i "$f" -o "$f.bin" && mv "$f.bin" "$f"; done
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci --no-audit --no-fund
      - run: npx expo config --type public
      - run: npx expo prebuild --platform ios --clean --no-install
      - name: Inspect iOS version resolution
        run: |
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" ios/RedPointChurch/Info.plist || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" ios/RedPointChurch/Info.plist || true
          xcodebuild -project ios/RedPointChurch.xcodeproj -scheme RedPointChurch -configuration Release -showBuildSettings | grep -E "MARKETING_VERSION|CURRENT_PROJECT_VERSION|PRODUCT_BUNDLE_IDENTIFIER"
